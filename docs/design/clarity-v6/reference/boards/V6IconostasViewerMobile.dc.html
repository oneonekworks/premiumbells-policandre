/* v6.2 overlays (lightbox, close-up viewer): see-through teal-900 (60%) + light blur 12 / saturate 1.4, so the page reads as soft shapes; edge gradients (85–88%) behind the top bar and the caption keep text readable on any page */

.lbp{display:block;height:auto;max-height:100%;object-fit:cover;box-shadow:0 24px 64px rgba(2,12,11,.55),0 2px 8px rgba(2,12,11,.35)}

.lbs img{width:100%;height:100%;object-fit:cover}

.zbox.zoomed{cursor:grab}.zbox.zoomed.drag{cursor:grabbing}
.cvs{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}

.zhint{position:absolute;left:50%;top:14px;transform:translateX(-50%);height:36px;padding:0 14px;display:flex;align-items:center;gap:8px;border-radius:999px;font:500 14px Inter,sans-serif;color:#eef3f1;white-space:nowrap;pointer-events:none}

.lbs button:hover{opacity:.85}.lbs button.on{opacity:1;box-shadow:0 0 0 2px #eef3f1}
.lbs button img{width:100%;height:100%;object-fit:cover}
@media (prefers-reduced-motion: reduce){.cvs.anim{transition:none}}
